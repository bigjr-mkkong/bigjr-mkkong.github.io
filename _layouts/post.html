<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIGJR-Publication</title>

    <!-- Load CSS -->
    <link rel="stylesheet" href="/styles.css">

    <!-- Load JavaScript -->
    <script defer src="/stars.js"></script>         <!-- Falling star effect -->
</head>
<body>

      <header style="text-align: center; padding: 1rem;">
    <a href="/index.html" style="color: #00ffff; margin-right: 1rem;">Home</a>
    <a href="/blogs/blog-index.html" style="color: #00ffff;">Blog List</a>
  </header>

  <div class="normtxt">
    <article>
      <h2>{{ page.title }}</h2>
      <p><em>{{ page.date | date: "%B %d, %Y" }}</em></p>
      <div class="post-content">
        {{ content }}
      </div>
    </article>
  </div>

  <footer>
    <p>&copy; {{ site.time | date: "%Y" }} BIGJR</p>
  </footer>

    <div class="sakana-box">
        <script src="https://cdn.jsdelivr.net/npm/sakana"></script>
            <script>
            function get_scale() {
                const width = window.innerWidth;
                if (width <= 480) return 0.0;
                if (width <= 768) return 0.3;
                return 0.5;                 
            }

                function initSakana() {
      document.querySelector('.sakana-box').innerHTML = '';

      Sakana.init({
        el: '.sakana-box',
        scale: get_scale(),
        canSwitchCharacter: true,
      });
    }

    initSakana();

    window.addEventListener('resize', () => {
      initSakana();
    });
        </script>
    </div>
</body>


</html>
