---
layout: default
title: Blog
---

<h1>Blog(s)</h1>

<div class="normtxt">
  <h3>2025</h3>
  <ul>
    {% for post in site.posts %}
      <li>
        <a href="{{ post.url }}">{{ post.title }}</a> - {{ post.date | date: "%B %d, %Y" }}
      </li>
    {% endfor %}
  </ul>
</div>

<div class="sakana-box">
  <script src="https://cdn.jsdelivr.net/npm/sakana"></script>
  <script>
    function get_scale() {
      const width = window.innerWidth;
      if (width <= 480) return 0.0;
      if (width <= 768) return 0.3;
      return 0.5;
    }

    function initSakana() {
      document.querySelector('.sakana-box').innerHTML = '';

      Sakana.init({
        el: '.sakana-box',
        scale: get_scale(),
        canSwitchCharacter: true,
      });
    }

    initSakana();
    window.addEventListener('resize', initSakana);
  </script>
</div>
