<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Cookie</title>

    <!-- Load CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Load JavaScript -->
    <script defer src="fortune-quotes.js"></script> <!-- Loads 200 fortune quotes -->
    <script defer src="fortune.js"></script>       <!-- Fortune logic -->
    <script defer src="stars.js"></script>         <!-- Falling star effect -->
</head>
<body>
    <h1>Welcome to my site!</h1>
    <h3>🔮 Crack Open Your $fortune Cookie 🔮</h3>
    <p class="cookie" id="cookie" onclick="crackCookie()">>>>🍪<<<</p>

    <div id="fortunePopup" class="popup">
        <p id="fortuneText"></p>
        <button onclick="closePopup()">Close</button>
    </div>

    <div class="sakana-box">
        <script src="https://cdn.jsdelivr.net/npm/sakana"></script>
            <script>
            Sakana.init({
              el:         '.sakana-box',     
              scale:      .5,                
              canSwitchCharacter: true,      
            });
        </script>
    </div>
</body>
</html>
